# Failed CouchDB logins (POST /_session 40[13]). fail2ban strips the timestamp
# before matching. Line: [notice] TS couchdb@host <pid> reqid HOSTNAME CLIENTIP user POST /_session 40[13] ok ms
[Definition]
failregex = ^\[notice\]\s+(?:\S+\s+)?couchdb@\S+\s+<[^>]+>\s+\S+\s+\S+\s+<HOST>\s+\S+\s+POST /_session 40[13]
